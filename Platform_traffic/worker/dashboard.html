<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社媒发布数据看板</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#172b27;background:#f4f6f2;--line:#e0e7df;--muted:#51665f;--green:#17694f}*{box-sizing:border-box}body{margin:0}header{background:#12332a;color:white;padding:24px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;gap:12px;font-weight:700}.logo{width:23px;height:23px;display:inline-flex;align-items:end;gap:3px}.logo i{width:5px;background:#a8edc7;border-radius:2px}.logo i:nth-child(1){height:8px}.logo i:nth-child(2){height:14px}.logo i:nth-child(3){height:22px}main{max-width:1248px;margin:auto;padding:36px 24px 60px}.intro{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.05em;margin:0 0 9px}h2{font-size:1.25rem;margin:0}.sub,.note{color:var(--muted);margin:0;font-size:.9rem}.status{margin:18px 0;background:#e7efe8;color:#254a3c;padding:12px 16px;border-radius:8px;font-size:.9rem}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:20px 0}label{display:grid;gap:6px;font-size:.875rem;color:var(--muted)}select,input,button{font:inherit;border:1px solid #cbd8ce;border-radius:8px;background:white;color:#18342b;padding:9px 11px;min-height:40px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px}.card{padding:18px 20px}.card strong{display:block;font-variant-numeric:tabular-nums;font-size:clamp(1.3rem,4vw,2.4rem);letter-spacing:-.04em;margin:8px 0;overflow-wrap:anywhere}.panel{padding:20px;margin-top:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.switch{display:flex;gap:4px;background:#edf2ed;padding:4px;border-radius:9px}.switch button{border:0;background:transparent;min-height:34px;padding:5px 13px}.switch button[aria-pressed=true]{background:#17694f;color:white}.chart{height:235px;width:100%;display:block;margin-top:12px}.chart text{fill:#51665f;font:12px system-ui}.chart .grid{stroke:#e1e9e2;stroke-width:1}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}.legend button[aria-pressed=true]{background:#e6f4eb;border-color:#589977}.table-wrap{overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:.9rem}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}a{color:var(--green);text-underline-offset:3px}td:first-child{min-width:180px;max-width:360px;white-space:normal}.empty{padding:30px 10px;color:var(--muted);text-align:center}.num{font-variant-numeric:tabular-nums}details{margin-top:14px}summary{cursor:pointer;color:var(--green);font-size:.9rem}@media(max-width:600px){main{padding:23px 13px 35px}.card,.panel{padding:12px}.cards{gap:6px}.card .note{font-size:.75rem}.switch button{padding:5px 9px}}
.platform-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 0;border-bottom:1px solid var(--line);padding-bottom:8px}.platform-tabs button{background:transparent;border-color:transparent;font-weight:600;padding:8px 16px}.platform-tabs button[aria-pressed=true]{color:white;background:var(--green)}.cards.four{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:700px){.cards.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.profile-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin-top:14px}.profile{border:1px solid var(--line);border-radius:10px;padding:13px 15px}.profile h3{margin:0 0 11px;font-size:1rem}.profile h3 a{text-decoration:none}.profile dl{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:12px;margin:0 0 10px}.profile dl>div:last-child{justify-self:end;text-align:left}.profile dd{overflow-wrap:anywhere}.profile dt{font-size:.85rem;color:var(--muted)}.profile dd{margin:3px 0 0;font-size:1.35rem;font-weight:700}


.follower-charts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:14px}.follower-chart{min-width:0;border:1px solid var(--line);border-radius:10px;padding:14px}.follower-chart h3{margin:0 0 6px;font-size:1rem}.follower-chart .chart{height:auto;min-height:130px;margin-top:8px}.follower-chart .chart text{font-size:11px}
.trend-tabs{display:inline-flex;margin-top:12px}
</style></head>
<body><header><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>社媒数据</header>
<main>
<div class="intro"><div><h1>发布数据看板</h1><p class="sub">平台账号 · 北京时间</p></div><div class="intro-actions"><p class="note" id="last"></p><button type="button" data-open-collection>自动采集设置</button><button type="button" id="refresh">刷新</button></div></div>
<div id="status" class="status" role="status">正在读取数据……</div>
<nav id="platform-tabs" class="platform-tabs" aria-label="按平台查看"></nav>
<section class="panel" id="profiles"><h2>账号概况</h2><div class="profile-list" id="profile-list"></div></section>
<section class="panel">
<div class="panel-head"><h2>粉丝变化</h2><div class="switch" id="periods" aria-label="时间粒度"></div></div>
<div class="switch trend-tabs" id="trend-tabs" aria-label="粉丝趋势指标"></div>
<div class="follower-charts" id="follower-charts"></div>
<details id="trend-details"><summary>查看粉丝变化明细</summary><div class="table-wrap"><table>
<thead><tr><th>时段</th><th>账号</th><th>净增粉丝</th><th>涨幅</th></tr></thead><tbody id="period-table"></tbody>
</table></div></details>
</section>
<section id="collection-log" class="panel">
<h2>采集日志</h2>
<form class="filters" id="log-filters" aria-label="采集日志筛选">
<label>平台<select id="log-platform"></select></label>
<label>时段<select id="log-period"><option value="day">日</option><option value="hour">小时段</option></select></label>
<label>日期<input type="date" id="log-date"></label>
<label id="log-start-label" style="display:none">开始小时<select id="log-start"></select></label>
<label id="log-end-label" style="display:none">结束小时<select id="log-end"></select></label>
</form>
<p class="note" id="log-status" role="status"></p>
<div class="table-wrap" id="collection-log-table"></div>
</section></main>
<script>
const $ = id => view.querySelector('#'+id);
const platforms = {'':'全部',X:'X',Instagram:'Instagram',TikTok:'TikTok'};
const periods = {hour:'小时',day:'日',month:'月',year:'年'};
const trendMetrics = {percent:'粉丝涨幅',followers:'粉丝数量'};
const colors = {X:'#17694f',Instagram:'#a43e74',TikTok:'#4165b6'};
const fmt = new Intl.NumberFormat('zh-CN');
const pct = new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2,style:'percent'});
const clock = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const format = value => value == null ? '暂无数据' : typeof value==='string'?value:fmt.format(value);
const date = value => clock.format(value);
let unit='day', trendMetric='percent', requestId=0, data;
let chartWidth=0;

function element(tag,text,className) {
  const node=document.createElement(tag);
  if(text!=null)node.textContent=text;
  if(className)node.className=className;
  return node;
}
function switches(target,choices,selected,apply) {
  target.replaceChildren();
  for(const [key,label] of Object.entries(choices)){
    const button=element('button',label);
    button.type='button';button.setAttribute('aria-pressed',key===selected);
    button.onclick=()=>apply(key);target.append(button);
  }
}
function renderProfiles(profiles,posts) {
  const list=$('profile-list');
  if(!profiles.length){list.replaceChildren(element('p','暂无账号数据','note'));return;}
  list.replaceChildren(...profiles.map(profile=>{
    const card=element('article',null,'profile');
    const heading=element('h3');
    const link=element('a',profile.platform+' · @'+profile.handle);
    link.href=profile.url;link.target='_blank';link.rel='noopener noreferrer';
    heading.append(link);
    const stats=element('dl');
    const handle=profile.handle.toLowerCase();
    const postCount=posts.filter(post=>post.platform===profile.platform &&
      post.account?.replace(/^@/,'').toLowerCase()===handle).length;
    for(const [label,value] of [['粉丝数',profile.followers],['关注数',profile.following],['总发帖数',postCount]]){
      const pair=element('div');
      pair.append(element('dt',label),element('dd',format(value)));
      stats.append(pair);
    }
    card.append(heading,stats,element('p','最近采集 '+date(profile.capturedAt),'note'));
    return card;
  }));
}
function periodLabel(value) {
  const label=date(value);
  if(unit==='hour')return label.slice(5);
  if(unit==='month')return label.slice(0,7);
  if(unit==='year')return label.slice(0,4);
  return label.slice(0,10);
}
function axisLabel(value) {
  if(unit==='hour')return date(value).slice(11,16);
  if(unit==='day')return date(value).slice(5,10);
  return periodLabel(value);
}
function tickIndices(length,width) {
  if(length<2)return length?[0]:[];
  const gap=unit==='month'?80:65;
  const count=Math.min(length,12,Math.max(2,Math.floor(width/gap)+1));
  return Array.from({length:count},(_,i)=>Math.round(i*(length-1)/(count-1)));
}
function trendValue(value) {
  return trendMetric==='percent'?pct.format(value/100):fmt.format(value);
}
function renderCollectionLog(records) {
  const list=$('collection-log-table');
  if(!records.length){list.replaceChildren();return;}
  const table=element('table');
  const heading=table.createTHead().insertRow();
  for(const label of ['时段','平台','账号','采集时间','粉丝数量'])heading.append(element('th',label));
  const body=table.createTBody();
  for(const entry of records){
    const row=body.insertRow();
    const sampledAt=date(entry.sampledAt);
    for(const value of [sampledAt.slice(0,10),entry.platform,'@'+entry.handle,sampledAt,fmt.format(entry.followers)]){
      row.insertCell().textContent=value;
    }
  }
  list.replaceChildren(table);
}
const hourLabel = hour => String(hour).padStart(2,'0')+':00';
let logRequestId=0;
async function loadCollectionLog() {
  const id=++logRequestId;
  const hourly=$('log-period').value==='hour';
  const day=$('log-date');
  day.required=hourly;
  $('log-start-label').style.display=hourly?'':'none';
  $('log-end-label').style.display=hourly?'':'none';
  if(hourly&&!day.value)day.value=date(Date.now()).slice(0,10);
  const status=$('log-status');
  $('collection-log-table').replaceChildren();
  const query=new URLSearchParams({platform:$('log-platform').value,date:day.value});
  if(hourly){
    const start=$('log-start').value,end=$('log-end').value;
    if(Number(start)>=Number(end)){status.textContent='结束小时须晚于开始小时';return;}
    query.set('startHour',start);
    query.set('endHour',end);
  }
  status.textContent='正在读取采集记录……';
  try {
    const response=await fetch('/api/collection-log?'+query);
    const result=await response.json();
    if(id!==logRequestId)return;
    if(!response.ok)throw new Error(result.error||'读取采集记录失败');
    renderCollectionLog(result.records);
    status.textContent=result.records.length?(day.value?'':'最近 30 天'):'暂无匹配的采集记录';
  }catch(error){if(id===logRequestId)status.textContent=error.message;}
}
function drawChart(name,trend,observations,high,low) {
  const card=element('article',null,'follower-chart');
  card.append(element('h3',name));
  const showCounts=trendMetric==='followers';
  const latest=observations.filter(point=>point[showCounts?'followers':'growth']!=null).at(-1);
  if(latest){
    const rate=latest.percent==null?'—':pct.format(latest.percent/100);
    const summary=showCounts?'最近采集 '+fmt.format(latest.followers)+' 位粉丝'
      :'最近时段净增 '+fmt.format(latest.growth)+' 位 · 涨幅 '+rate;
    card.append(element('p',summary,'note'));
  }
  const points=observations.filter(point=>point[trendMetric]!=null);
  if(!points.length){
    const message=showCounts?'暂无粉丝数量记录':latest?'期初粉丝数为 0，无法计算百分比':'暂无可计算的粉丝变化';
    card.append(element('p',message,'empty'));
    return card;
  }
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  const canvasWidth=Math.max(300,$('follower-charts').clientWidth-30);
  const left=44,right=canvasWidth-26;
  const plotWidth=right-left;
  svg.setAttribute('viewBox','0 0 '+canvasWidth+' 160');
  svg.setAttribute('class','chart');
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label',name+trendMetrics[trendMetric]+'趋势');
  function node(tag,attrs,text,owner=svg) {
    const item=document.createElementNS(svg.namespaceURI,tag);
    for(const [key,value] of Object.entries(attrs))item.setAttribute(key,value);
    if(text!=null)item.textContent=text;
    owner.append(item);return item;
  }
  const y=value=>12+(high-value)*108/(high-low);
  const x=index=>left+(index+.5)*plotWidth/Math.max(trend.length,1);
  const grid=showCounts?[...new Set([0,Math.floor(high/2),high])]:[low,0,high];
  for(const value of grid){
    node('line',{x1:left,x2:right,y1:y(value),y2:y(value),class:'grid'});
    node('text',{x:left-6,y:y(value)+4,'text-anchor':'end'},trendValue(value));
  }
  const width=Math.max(2,Math.min(12,plotWidth/trend.length*.6));
  for(const point of points){
    const value=point[trendMetric];
    const bar=node('rect',{x:x(point.index)-width/2,y:Math.min(y(value),y(0)),width,
      height:Math.max(2,Math.abs(y(value)-y(0))),fill:colors[name]});
    const percent=point.percent==null?'—':pct.format(point.percent/100);
    const valueLabel=showCounts?fmt.format(point.followers)+' 位粉丝':fmt.format(point.growth)+' 位 · 涨幅 '+percent;
    node('title',{},periodLabel(point.start)+' · @'+point.handle+' · '+valueLabel,bar);
  }
  for(const index of tickIndices(trend.length,plotWidth)){
    const anchor=index===0?'start':index===trend.length-1?'end':'middle';
    node('line',{x1:x(index),x2:x(index),y1:124,y2:128,class:'grid'});
    node('text',{x:x(index),y:144,'text-anchor':anchor},axisLabel(trend[index].start));
  }
  card.append(svg);
  return card;
}
function draw() {
  const trend=data.trend;
  const points=trend.flatMap((period,index)=>period.accounts
    .filter(account=>account.followers!=null||account.growth!=null).map(account=>({...account,index,start:period.start})));
  const values=points.map(point=>point[trendMetric]).filter(value=>value!=null);
  const high=Math.max(1,...values);
  const low=trendMetric==='followers'?0:Math.min(-1,...values);
  switches($('trend-tabs'),trendMetrics,trendMetric,key=>{trendMetric=key;draw();});
  $('follower-charts').replaceChildren(...Object.keys(colors).map(name=>
    drawChart(name,trend,points.filter(point=>point.platform===name),high,low)));
  $('period-table').replaceChildren();
  const growthPoints=points.filter(point=>point.growth!=null);
  $('trend-details').hidden=trendMetric==='followers'||!growthPoints.length;
  if(trendMetric==='followers')return;
  for(const point of growthPoints.slice().reverse()){
    const row=$('period-table').insertRow();
    for(const value of [periodLabel(point.start),point.platform+' · @'+point.handle,fmt.format(point.growth),
      point.percent==null?'—':pct.format(point.percent/100)])row.insertCell().textContent=value;
  }
}
async function load() {
  const id=++requestId;
  switches($('platform-tabs'),platforms,'',choosePlatform);
  switches($('periods'),periods,unit,key=>{unit=key;load();});
  $('status').textContent='正在读取账号数据……';
  try {
    const query=new URLSearchParams({unit});
    const response=await fetch('/api/dashboard?'+query);
    const result=await response.json();
    if(id!==requestId)return;
    if(!response.ok)throw new Error(result.error||'读取失败');
    data=result;
    renderProfiles(data.profiles,data.posts);
    $('last').textContent=data.accountFeedAt?'最近采集 '+date(data.accountFeedAt):'';
    const web=[...new Set(data.profiles.map(p=>p.platform))].filter(p=>data.modes?.[p]==='web');
    $('status').textContent=web.length?web.join('、')+' 使用网页采集':'等待账号采集';
    draw();
  }catch(error){if(id===requestId)$('status').textContent=error.message;}
}
if(typeof ResizeObserver==='function'){
  new ResizeObserver(([entry])=>{
    const width=Math.round(entry.contentRect.width);
    if(width===chartWidth)return;
    chartWidth=width;
    if(data)draw();
  }).observe($('follower-charts'));
}
for(const [value,label] of Object.entries(platforms))$('log-platform').add(new Option(label,value));
for(let hour=0;hour<24;hour++){
  $('log-start').add(new Option(hourLabel(hour),hour));
  $('log-end').add(new Option(hourLabel(hour+1),hour+1));
}
$('log-end').value='24';
$('log-filters').onchange=loadCollectionLog;
$('log-filters').onsubmit=event=>{event.preventDefault();loadCollectionLog();};
$('refresh').onclick=()=>{load();loadCollectionLog();};
loadCollectionLog();
load();
</script></body></html>
